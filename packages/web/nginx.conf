server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para reducir el tamaño de respuestas
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache de un año para assets con hash en el nombre (immutable)
    # Vite genera nombres como main-BxYz1234.js que nunca cambian para el mismo contenido
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: todas las rutas no encontradas van a index.html
    # Necesario para que React Router maneje el ruteo del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }
}
